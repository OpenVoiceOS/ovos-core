[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-core"
dynamic = ["version"]
description = "The spiritual successor to Mycroft AI, OVOS is flexible voice assistant software that can be run almost anywhere!"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.26, <3.0",
    "python-dateutil>=2.6, <3.0",
    "watchdog>=2.1, <3.0",
    "combo-lock>=0.2.2, <0.4",
    "ovos-utils>=0.11.1a1,<1.0.0",
    "ovos_bus_client>=1.3.6a1,<3.0.0",
    "ovos-plugin-manager>=1.0.3,<3.0.0",
    "ovos-config>=0.0.13,<3.0.0",
    "ovos-workshop>=7.0.6,<9.0.0",
    "rapidfuzz>=3.6,<4.0",
    "ovos-spec-tools[langcodes]>=0.5.1a1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-core"
Repository = "https://github.com/OpenVoiceOS/ovos-core"

[project.optional-dependencies]
test = [
    "coveralls>=1.8.2",
    "flake8>=3.7.9",
    "pytest>=5.2.4",
    "pytest-cov>=2.8.1",
    "pytest-testmon>=2.1.3",
    "pytest-randomly>=3.16.0",
    "cov-core>=1.15.0",
    "ovoscope>=0.13.1,<1.0.0",
    "ovos-m2v-pipeline>=0.0.6,<1.0.0",
    "ovos-adapt-parser>=1.0.6, <2.0.0",
    "ovos_padatious>=1.4.2,<2.0.0",
    "ovos-utterance-plugin-cancel>=0.3.0a1, <1.0.0",
    "ovos-skill-count>=0.0.1",
    "ovos-skill-hello-world>=0.1.10",
    "ovos-skill-parrot>=0.1.25",
    "ovos-skill-fallback-unknown>=0.1.9",
]
mycroft = [
    "ovos_PHAL[extras]>=0.2.9,<1.0.0",
    "ovos-audio[extras]>=1.0.1,<2.0.0",
    "ovos-audio>=1.0.1,<2.0.0",
    "ovos-gui[extras]>=1.3.3,<2.0.0",
    "ovos-messagebus>=0.0.7,<1.0.0",
    "ovos-dinkum-listener[extras]>=0.4.1,<1.0.0",
]
lgpl = [
    "ovos_padatious>=1.4.2,<2.0.0",
    "fann2>=1.0.7,<1.1.0",
]
plugins = [
    "ovos-utterance-corrections-plugin>=0.1.1, <1.0.0",
    "ovos-utterance-plugin-cancel>=0.3.0a1, <1.0.0",
    "ovos-bidirectional-translation-plugin>=0.1.0, <1.0.0",
    "ovos-translate-server-plugin>=0.0.4, <1.0.0",
    "ovos-utterance-normalizer>=0.2.2, <1.0.0",
    "ovos-number-parser>=0.0.1,<1.0.0",
    "ovos-date-parser>=0.0.3,<1.0.0",
    "ovos-m2v-pipeline>=0.0.6,<1.0.0",
    "ovos-common-query-pipeline-plugin>=1.1.8, <2.0.0",
    "ovos-adapt-parser>=1.0.6, <2.0.0",
    "ovos_ocp_pipeline_plugin>=1.1.18a1, <2.0.0",
    "ovos-persona>=0.6.23,<1.0.0",
    "padacioso>=1.0.0, <2.0.0",
    "keyword-template-matcher>=0.1.1,<1.0.0",
    "ahocorasick-ner>=0.1.1,<1.0.0",
]
skills-essential = [
    "ovos-skill-fallback-unknown>=0.1.9",
    "ovos-skill-alerts>=0.1.10",
    "ovos-skill-personal>=0.1.19",
    "ovos-skill-date-time>=1.1.3,<2.0.0",
    "ovos-skill-hello-world>=0.1.10",
    "ovos-skill-spelling>=0.2.5",
    "ovos-skill-diagnostics>=0.0.2",
    "ovos-skill-parrot>=0.1.25",
    "ovos-skill-count>=0.0.1",
    "ovos-skill-randomness>=0.1.2; python_version >= \"3.10\"",
]
skills-extra = [
    "ovos-skill-wordnet>=0.2.5",
    "ovos-skill-laugh>=0.1.1",
    "ovos-skill-number-facts>=0.1.12",
    "ovos-skill-iss-location>=0.2.16",
    "ovos-skill-cmd>=0.2.11",
    "ovos-skill-moviemaster>=0.0.12",
    "ovos-skill-confucius-quotes>=0.1.13",
    "ovos-skill-icanhazdadjokes>=0.3.7",
    "ovos-skill-camera",
]
skills-audio = [
    "ovos-skill-boot-finished>=0.4.8",
    "ovos-skill-audio-recording>=0.2.4",
    "ovos-skill-dictation>=0.2.5",
    "ovos-skill-volume>=0.1.16",
    "ovos-skill-naptime>=0.3.15",
]
skills-desktop = [
    "ovos-skill-application-launcher>=0.5.14",
    "ovos-skill-wallpapers>=1.0.2",
    "ovos-skill-screenshot>=0.0.2",
]
skills-internet = [
    "ovos-skill-weather>=1.0.3",
    "ovos-skill-ddg>=0.3.5",
    "ovos-skill-wolfie>=0.5.8",
    "ovos-skill-wikipedia>=0.8.13",
    "ovos-skill-wikihow>=0.3.3",
    "ovos-skill-speedtest>=0.3.6",
    "ovos-skill-ip>=0.2.5",
]
skills-gui = [
    "ovos-skill-homescreen>=3.0.3",
    "ovos-skill-screenshot>=0.0.2",
    "ovos-skill-color-picker>=0.0.2",
]
skills-media = [
    "ovos-skill-somafm>=0.1.3",
    "ovos-skill-news>=0.4.6a1",
    "ovos-skill-pyradios>=0.1.5",
    "ovos-skill-local-media>=0.2.12",
    "ovos-skill-youtube-music>=0.1.7",
]
skills-ca = [
    "ovos-skill-fuster-quotes",
    "ovos-skill-word-of-the-day",
]
skills-pt = [
    "ovos-skill-word-of-the-day",
]
skills-gl = [
    "ovos-skill-word-of-the-day>=0.2.0",
]
skills-en = [
    "ovos-skill-word-of-the-day",
    "ovos-skill-days-in-history>=0.3.11",
]

[project.scripts]
ovos-core = "ovos_core.__main__:main"
ovos-intent-service = "ovos_core.intent_services.service:launch_standalone"
ovos-skill-installer = "ovos_core.skill_installer:launch_standalone"

[project.entry-points."opm.pipeline"]
ovos-converse-pipeline-plugin = "ovos_core.intent_services.converse_service:ConverseService"
ovos-fallback-pipeline-plugin = "ovos_core.intent_services.fallback_service:FallbackService"
ovos-stop-pipeline-plugin = "ovos_core.intent_services.stop_service:StopService"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_core*"]

[tool.setuptools.package-data]
ovos_core = [
    "intent_services/locale/*/*.voc",
]

[tool.setuptools.dynamic]
version = {attr = "ovos_core.version.__version__"}
