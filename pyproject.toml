[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-core"
dynamic = ["version"]
description = "The spiritual successor to Mycroft AI, OVOS is flexible voice assistant software that can be run almost anywhere!"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.26, <3.0",
    "packaging>=20.0",
    "python-dateutil>=2.6, <3.0",
    "combo-lock>=0.2.2, <0.4",
    "ovos-utils>=0.13.9a1,<1.0.0",
    "ovos_bus_client>=2.7.1a1,<3.0.0",
    "ovos-plugin-manager>=2.11.1a1,<3.0.0",
    "ovos-config>=2.1.4a5,<3.0.0",
    "ovos-workshop>=9.3.1a2,<10.0.0",
    "rapidfuzz>=3.6,<4.0",
    "ovos-spec-tools[langcodes]>=1.5.1a2,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-core"
Repository = "https://github.com/OpenVoiceOS/ovos-core"

[project.optional-dependencies]
test = [
    "coveralls>=1.8.2",
    "flake8>=3.7.9",
    "pytest>=5.2.4",
    "pytest-cov>=2.8.1",
    "pytest-testmon>=2.1.3",
    "pytest-randomly>=3.16.0",
    "cov-core>=1.15.0",
    "ovoscope>=1.6.1a1,<2.0.0",
    "ovos-m2v-pipeline>=0.5.4a1,<1.0.0",
    "ovos-adapt-parser>=1.6.1a1,<2.0.0",
    "ovos_padatious>=2.0.0a1,<3.0.0",
    "ovos-utterance-plugin-cancel>=0.3.3a1, <1.0.0",
    "ovos-skill-count>=0.0.6a1",
    "ovos-skill-hello-world>=0.2.6a2",
    "ovos-skill-parrot>=0.1.31a2",
    "ovos-skill-fallback-unknown>=0.1.12a1",
    # data-over-sound install path: ggwave audio -> skill installer
    "ovos-dinkum-listener>=0.8.2a2,<1.0.0",
    "ovos-audio-transformer-plugin-ggwave>=1.0.0a1,<2.0.0",
]
mycroft = [
    "ovos_PHAL[extras]>=0.2.16a1,<1.0.0",
    "ovos-audio[extras]>=2.1.1a2,<3.0.0",
    "ovos-gui>=1.4.1a1,<2.0.0",
    "ovos-messagebus>=0.2.1a1,<1.0.0",
    "ovos-dinkum-listener[extras]>=0.8.2a2,<1.0.0",
]
lgpl = [
    "ovos_padatious>=2.0.0a1,<3.0.0",
    "fann2>=1.0.7,<1.1.0",
]
plugins = [
    "ovos-utterance-corrections-plugin>=0.1.3a5, <1.0.0",
    "ovos-utterance-plugin-cancel>=0.3.3a1, <1.0.0",
    "ovos-bidirectional-translation-plugin>=0.1.3a4, <1.0.0",
    "ovos-translate-server-plugin>=0.0.8a1, <1.0.0",
    "ovos-utterance-normalizer>=0.2.5a1, <1.0.0",
    "ovos-number-parser>=0.19.8a1,<1.0.0",
    "ovos-date-parser>=0.29.0,<1.0.0",
    "ovos-m2v-pipeline>=0.5.4a1,<1.0.0",
    "ovos-common-query-pipeline-plugin>=1.1.15a1, <2.0.0",
    "ovos-adapt-parser>=1.6.1a1,<2.0.0",
    "ovos_ocp_pipeline_plugin>=1.1.28a1, <2.0.0",
    "ovos-persona>=0.9.0a15,<1.0.0",
    "padacioso>=2.2.1a1,<3.0.0",
    "keyword-template-matcher>=0.1.3a1,<1.0.0",
    "ahocorasick-ner>=0.1.1,<1.0.0",
]
skills-essential = [
    "ovos-skill-fallback-unknown>=0.1.12a1",
    "ovos-skill-alerts>=0.2.2a1",
    "ovos-skill-personal>=0.1.25a1",
    "ovos-skill-date-time>=1.1.14a1,<2.0.0",
    "ovos-skill-hello-world>=0.2.6a2",
    "ovos-skill-spelling>=0.2.7a2",
    "ovos-skill-diagnostics>=0.0.12a2",
    "ovos-skill-parrot>=0.1.31a2",
    "ovos-skill-count>=0.0.6a1",
    "ovos-skill-randomness>=1.1.0a1; python_version >= \"3.10\"",
]
skills-extra = [
    "ovos-skill-wordnet>=0.5.0a1",
    "ovos-skill-laugh>=1.0.6a1",
    "ovos-skill-number-facts>=0.1.13a5",
    "ovos-skill-iss-location>=0.2.18a5",
    "ovos-skill-cmd>=0.2.14a3",
    "ovos-skill-moviemaster>=0.0.15a1",
    "ovos-skill-confucius-quotes>=0.3.1a1",
    "ovos-skill-icanhazdadjokes>=0.3.11a2",
    "ovos-skill-camera",
]
skills-audio = [
    "ovos-skill-boot-finished>=0.5.5a2",
    "ovos-skill-audio-recording>=0.2.12a1",
    "ovos-skill-dictation>=0.2.25a1",
    "ovos-skill-volume>=0.1.22a3",
    "ovos-skill-naptime>=0.4.0a3",
]
skills-desktop = [
    "ovos-skill-application-launcher>=0.6.0a3",
    "ovos-skill-wallpapers>=1.0.14a5",
    "ovos-skill-screenshot>=0.0.10a3",
]
skills-internet = [
    "ovos-skill-weather>=1.0.12a2",
    "ovos-skill-ddg>=0.3.9a2",
    "ovos-skill-wolfie>=0.7.1a2",
    "ovos-skill-wikipedia>=0.8.17a3",
    "ovos-skill-wikihow>=0.3.7a1",
    "ovos-skill-speedtest>=0.3.8a5",
    "ovos-skill-ip>=0.3.0a3",
]
skills-gui = [
    "ovos-skill-homescreen>=3.0.4a1",
    "ovos-skill-screenshot>=0.0.10a3",
    "ovos-skill-color-picker>=0.1.0a1",
]
skills-media = [
    "ovos-skill-somafm>=0.1.6a8",
    "ovos-skill-news>=0.4.9a2",
    "ovos-skill-pyradios>=0.1.6a7",
    "ovos-skill-local-media>=0.2.15a2",
    "ovos-skill-youtube-music>=0.1.10a2",
]
skills-ca = [
    "ovos-skill-fuster-quotes",
    "ovos-skill-word-of-the-day>=0.2.5",
]
skills-pt = [
    "ovos-skill-word-of-the-day>=0.2.5",
]
skills-gl = [
    "ovos-skill-word-of-the-day>=0.2.5",
]
skills-en = [
    "ovos-skill-word-of-the-day>=0.2.5",
    "ovos-skill-days-in-history>=0.3.12a5",
]

[project.scripts]
ovos-core = "ovos_core.__main__:main"
ovos-intent-service = "ovos_core.intent_services.service:launch_standalone"
ovos-skill-installer = "ovos_core.skill_installer:launch_standalone"

[project.entry-points."opm.pipeline"]
ovos-converse-pipeline-plugin = "ovos_core.intent_services.converse_service:ConverseService"
ovos-fallback-pipeline-plugin = "ovos_core.intent_services.fallback_service:FallbackService"
ovos-stop-pipeline-plugin = "ovos_core.intent_services.stop_service:StopService"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_core*"]

[tool.setuptools.package-data]
ovos_core = [
    "intent_services/locale/*/*.voc",
]

[tool.setuptools.dynamic]
version = {attr = "ovos_core.version.__version__"}
